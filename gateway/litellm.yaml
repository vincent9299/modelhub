# ============================================
# modelhub LiteLLM 网关配置
#
# 端点与密钥全部经环境变量注入(值在 .env, 由 start.sh 加载), 本文件可安全入库。
#
# 模型自动识别（/v1/models 自动带出, Cline 等客户端配置网关地址即可用）:
#   - OpenAI 兼容端点（vLLM/Galaxy/OpenRouter 等）: 启动时由 gateway/gen_local_models.py
#     探测其 /models 列表, 发现的模型以 <前缀>/<模型id> 注册;
#     OpenRouter 也走显式全量展开（litellm 的 openrouter/* 通配展开有 100 模型
#     上限, 截断严重, 已弃用; 发现失败时由脚本兜底写回通配）;
#   - 固定别名路由是给存量脚本的稳定短名(调用名不变)。
#
# 出口策略(进程级代理环境变量由 start.sh 注入):
#   - AI API 域名(OpenAI/OpenRouter/Claude 等) → mihomo STATIC 静态住宅出口;
#     名单见 static_proxy/config.yaml（modelhub 只维护这一层规则）
#   - 其余上游对 modelhub 而言都是直连(no_proxy), 是否还有主机级代理路由
#     由宿主机器自己的策略决定, modelhub 不感知、不维护
# ============================================

model_list:
  # ---- 本地 OpenAI 兼容端点（vLLM 等）: 由 gen_local_models.py 自动发现 ----
  # 启动时探测端点 /models 列表, 发现的模型以 vllm/<模型id> 注册进
  # /v1/models（如 vllm//tank/models/Qwen3.8-27B）。换端点/换模型只需改
  # .env 重启, 无需改这里。注意不用 openai/* 通配: 它会把 litellm 内置的
  # 整个 OpenAI 目录展开进 /v1/models, 污染清单。

  # ---- 稳定短名别名（存量调用名不变）----
  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: os.environ/VLLM_API_BASE
      api_key: os.environ/VLLM_API_KEY

  # ---- Galaxy 专线（OpenAI 兼容; 固定别名保存量调用名, 自动发现另注册 galaxy/<模型id>）----
  - model_name: qwen3.7-plus
    litellm_params:
      model: openai/qwen3.7-plus
      api_base: os.environ/GALAXY_API_BASE
      api_key: os.environ/GALAXY_API_KEY

  # ---- OpenRouter（由 gen_local_models.py 显式全量展开为 openrouter/<id>; 走静态出口）----

litellm_settings:
  drop_params: true        # 上游不支持的 sampling 参数自动丢弃, 减少 400
  request_timeout: 600     # 长思考模型留足时间
